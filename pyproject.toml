[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "brahmo"
version = "0.1.0"
description = "BRAHMO clinical AI assessment build: India drug master, deterministic safety rail, grounded STW Q&A"
requires-python = ">=3.9"
dependencies = [
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
llm = ["anthropic>=0.40"]
embed = ["sentence-transformers>=2.2"]

[project.scripts]
brahmo = "brahmo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
